<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantas vs Zombies - Diagnóstico</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">🌿</span>
          <span>Plantas vs Zombies</span>
        </div>
      </header>

      <main class="container">
        <section class="hero">
          <div class="hero-copy">
            <p class="eyebrow">Sistema de diagnóstico</p>
            <h1>Evalúa el estado de tu planta</h1>
            <p class="subtitle">
              Ingresa los datos ambientales para obtener el estado, rangos y recomendaciones.
            </p>
          </div>
        </section>

        <section class="card">
          <form id="diagnostico-form" class="form-grid">
            <div class="field">
              <label for="especie">Especie</label>
              <select id="especie" name="especie" required>
                <option value="">Selecciona una especie</option>
              </select>
            </div>

            <div class="field">
              <label for="humedad">Humedad (%)</label>
              <input id="humedad" name="humedad" type="number" step="0.1" value="10" required />
            </div>

            <div class="field">
              <label for="luz">Luz (lux)</label>
              <input id="luz" name="luz" type="number" step="0.1" value="500" required />
            </div>

            <div class="field">
              <label for="temperatura">Temperatura (°C)</label>
              <input id="temperatura" name="temperatura" type="number" step="0.1" value="20" required />
            </div>

            <button type="submit">Diagnosticar planta</button>
          </form>

          <p id="error-message" class="error-message hidden" aria-live="polite"></p>
        </section>

        <section id="resultado" class="card resultado hidden">
          <div class="resultado-header">
            <h2>Resultado del diagnóstico</h2>
            <span id="estado-badge" class="badge">--</span>
          </div>

          <div class="summary-grid">
            <div>
              <p class="label">Especie</p>
              <p id="resultado-especie" class="value">-</p>
            </div>
            <div>
              <p class="label">Estado general</p>
              <p id="resultado-estado" class="value">-</p>
            </div>
          </div>

          <div class="panel-grid">
            <div class="panel">
              <h3>Parámetros</h3>
              <ul id="lista-parametros"></ul>
            </div>

            <div class="panel">
              <h3>Recomendaciones</h3>
              <ul id="lista-recomendaciones"></ul>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
